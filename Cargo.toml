[package]
name = "cemantix"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
