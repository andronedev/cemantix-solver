[package]
name = "cemantix-web"
version = "0.1.0"
edition = "2024"
description = "Cémantix solver compiled to WebAssembly (assistant page)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cemantix-core = { path = "../core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
